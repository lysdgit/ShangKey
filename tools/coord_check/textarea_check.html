<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>textarea 光标测量校验</title>
<style>body{font:16px system-ui;padding:40px;background:#fff}
#dot{position:fixed;width:3px;height:18px;background:red;z-index:9999;pointer-events:none}</style>
</head>
<body>
<h2>textarea 光标测量校验</h2>
<p>红点应该正好压在文本光标上。打字后红点要跟着移动。</p>
<textarea id="t" rows="4" style="width:420px;font:18px/1.5 monospace;padding:8px 10px;border:2px solid #888">第一行内容</textarea>
<div id="dot"></div>
<script>
// 与 runtime/browser-extension/content.js 中的实现保持一致
const MIRROR_PROPS = [
  "boxSizing", "width", "height",
  "borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth",
  "paddingTop", "paddingRight", "paddingBottom", "paddingLeft",
  "fontStyle", "fontVariant", "fontWeight", "fontStretch", "fontSize",
  "lineHeight", "fontFamily", "textAlign", "textTransform", "textIndent",
  "letterSpacing", "wordSpacing", "tabSize", "whiteSpace", "overflowWrap",
  "wordBreak",
];

function textControlCaretRect(el) {
  const cs = window.getComputedStyle(el);
  const div = document.createElement("div");
  const st = div.style;
  st.position = "absolute";
  st.top = "0";
  st.left = "-9999px";
  st.visibility = "hidden";
  st.overflow = "hidden";
  st.whiteSpace = "pre-wrap";
  st.wordWrap = "break-word";
  for (const p of MIRROR_PROPS) {
    if (cs[p]) st[p] = cs[p];
  }
  st.width = el.clientWidth + "px";

  const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
  div.textContent = el.value.substring(0, pos);
  const span = document.createElement("span");
  span.textContent = el.value.substring(pos) || ".";
  div.appendChild(span);
  (document.body || document.documentElement).appendChild(div);

  const divRect = div.getBoundingClientRect();
  const spanRect = span.getBoundingClientRect();
  document.body.removeChild(div);

  const borderTop = parseFloat(cs.borderTopWidth) || 0;
  const borderLeft = parseFloat(cs.borderLeftWidth) || 0;
  const rect = el.getBoundingClientRect();
  const left = rect.left + borderLeft + (spanRect.left - divRect.left) - el.scrollLeft;
  const top = rect.top + borderTop + (spanRect.top - divRect.top) - el.scrollTop;
  const height = spanRect.height || parseFloat(cs.lineHeight)
    || parseFloat(cs.fontSize) * 1.2 || 18;
  return { left, top, height };
}

function draw() {
  const t = document.getElementById("t");
  const r = textControlCaretRect(t);
  const dot = document.getElementById("dot");
  dot.style.left = (r.left - 1) + "px";
  dot.style.top = r.top + "px";
  dot.style.height = r.height + "px";
  document.title = `DOT ${Math.round(r.left)} ${Math.round(r.top)}`;
}

const t = document.getElementById("t");
for (const ev of ["keyup", "input", "click", "select", "focus"]) {
  t.addEventListener(ev, () => setTimeout(draw, 30));
}
window.addEventListener("load", () => {
  t.focus();
  t.setSelectionRange(t.value.length, t.value.length);
  setTimeout(draw, 200);
});
</script>
</body></html>
